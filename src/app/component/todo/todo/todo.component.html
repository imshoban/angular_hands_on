<app-header></app-header>

<div class="container">
    <div class="loading-screen" *ngIf="isLoading">
        <h1>Loading....</h1>
    </div>
    <div class="todo-container">
        <img src="./assets/todo-img.png" alt="" width="50px">
        <input type="text" name="todo" id="todo" class="input-field" placeholder="Enter your todos" [(ngModel)] = "todoValue">
        <button class="btn" (click)="addTodo()" (keyup.enter)="addTodo()">Add</button>
    </div>
    <h3>Todo List</h3>
    <div class="todo-list"*ngFor = "let todo of todoList" >
        <div class="single-list" *ngIf="!todo.is_completed">
            <input type="checkbox" name="" id="" (change)="markAsComplete(todo.id)">
            <p class="todo-title">{{todo.title}}</p>
            <div class="delete-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16" (click)="deleteTodo(todo.id)">
                <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
              </svg></div>

        </div>
    </div>
    <hr>
    <div class="todo-list" *ngFor = "let todo of todoList">
        <div class="completed-list-meta " *ngIf ="todo.is_completed">
            <input type="checkbox" name="" id="" checked (change)="markAsNotComplete(todo.id)">
            <p class="todo-title">{{todo.title}}</p>
            <div class="delete-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16" (click)="deleteTodo(todo.id)">
                <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
              </svg></div>
        </div>
    </div>
</div>
